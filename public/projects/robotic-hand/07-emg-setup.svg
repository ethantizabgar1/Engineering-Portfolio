<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="EMG control setup wiring diagram">
  <rect width="800" height="600" fill="oklch(0.21 0.022 245)"/>
  <defs><pattern id="g7" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="oklch(0.74 0.13 215 / 0.10)" stroke-width="1"/></pattern></defs>
  <rect width="800" height="600" fill="url(#g7)"/>
  <!-- sensor -->
  <g stroke="oklch(0.74 0.13 215)" fill="oklch(0.74 0.13 215 / 0.18)" stroke-width="2">
    <rect x="120" y="200" width="120" height="70" rx="6"/>
  </g>
  <text x="180" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="oklch(0.74 0.13 215 / 0.9)">MyoWare</text>
  <!-- arduino -->
  <g stroke="oklch(0.74 0.13 215)" fill="oklch(0.74 0.13 215 / 0.06)" stroke-width="2">
    <rect x="500" y="180" width="180" height="120" rx="8"/>
  </g>
  <text x="590" y="245" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="oklch(0.74 0.13 215 / 0.9)">UNO R4</text>
  <!-- wiring -->
  <g stroke="oklch(0.95 0.008 240 / 0.6)" fill="none" stroke-width="1.5">
    <line x1="240" y1="220" x2="500" y2="220"/>
    <line x1="240" y1="235" x2="500" y2="235"/>
    <line x1="240" y1="250" x2="500" y2="250"/>
  </g>
  <text x="370" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="oklch(0.68 0.015 240)">ENV  VCC  GND</text>
  <!-- signal trace -->
  <g stroke="oklch(0.74 0.13 215 / 0.8)" fill="none" stroke-width="1.5">
    <path d="M120 420 h560"/>
    <path d="M120 420 l12 -6 l8 12 l10 -28 l10 34 l8 -10 l10 6 l10 -2 l10 8 l10 -20 l10 24 l8 -6 l10 0 l10 -8 l10 12 l10 -2 l10 4 h40"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="oklch(0.68 0.015 240)" letter-spacing="2">EMG ENVELOPE → A0</text>
  <text x="400" y="570" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="oklch(0.68 0.015 240)" letter-spacing="3">FIG. 07 — EMG CONTROL WIRING</text>
