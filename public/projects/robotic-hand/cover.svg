<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Robotic Hand & EMG Gesture Control — concept render">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="oklch(0.74 0.13 215 / 0.10)" stroke-width="1"/>
    </pattern>
    <pattern id="finegrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="oklch(0.74 0.13 215 / 0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="640" fill="oklch(0.21 0.022 245)"/>
  <rect width="800" height="640" fill="url(#finegrid)"/>
  <rect width="800" height="640" fill="url(#grid)"/>

  <!-- registration marks -->
  <g stroke="oklch(0.74 0.13 215 / 0.4)" stroke-width="1" fill="none">
    <path d="M24 24h16M24 24v16M776 24h-16M776 24v16M24 616h16M24 616v-16M776 616h-16M776 616v-16"/>
  </g>

  <!-- robotic hand schematic -->
  <g stroke="oklch(0.74 0.13 215)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- palm -->
    <path d="M320 380 h160 v90 h-160 z" />
    <path d="M340 470 h120 v60 h-120 z" />
    <!-- thumb -->
    <path d="M320 380 c-40 -10 -70 -40 -80 -80 c-6 -24 4 -46 22 -50" />
    <circle cx="258" cy="248" r="10"/>
    <!-- index -->
    <path d="M345 380 v-150 a8 8 0 0 1 16 0 v70 a8 8 0 0 0 16 0 v-90 a8 8 0 0 1 16 0 v110"/>
    <!-- middle -->
    <path d="M385 380 v-170 a8 8 0 0 1 16 0 v80 a8 8 0 0 0 16 0 v-110 a8 8 0 0 1 16 0 v130"/>
    <!-- ring -->
    <path d="M425 380 v-140 a8 8 0 0 1 16 0 v70 a8 8 0 0 0 16 0 v-90 a8 8 0 0 1 16 0 v110"/>
    <!-- pinky -->
    <path d="M465 380 v-110 a8 8 0 0 1 16 0 v50 a8 8 0 0 0 16 0 v-70 a8 8 0 0 1 16 0 v90"/>
  </g>

  <!-- tendon lines -->
  <g stroke="oklch(0.95 0.008 240 / 0.55)" fill="none" stroke-width="1" stroke-dasharray="3 3">
    <path d="M400 530 c-10 20 -20 30 -20 40"/>
    <path d="M353 380 v-150"/>
    <path d="M393 380 v-170"/>
    <path d="M433 380 v-140"/>
    <path d="M473 380 v-110"/>
  </g>

  <!-- EMG signal -->
  <g stroke="oklch(0.74 0.13 215 / 0.85)" fill="none" stroke-width="1.5">
    <path d="M540 470 h200"/>
    <path d="M540 470 l8 -4 l6 10 l8 -26 l8 32 l6 -10 l8 4 l8 -2 l8 6 l8 -18 l8 22 l6 -6 l8 0 l8 -8 l8 12 l8 -2 l8 4 h40"/>
  </g>

  <text x="400" y="612" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="oklch(0.68 0.015 240)" letter-spacing="3">ROBOTIC HAND — TENDON DRIVEN — EMG GESTURE CONTROL</text>
</svg>
